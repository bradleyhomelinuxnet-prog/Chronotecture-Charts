<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>%%TITLE%%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f1a; --bg2:#111726; --panel:#141b2d; --ink:#e9edf6; --muted:#8b95ad;
    --line:#24304a; --line2:#33415f;
    --c-comet:#5cb3f2; --c-quake:#f08a4b; --c-proph:#e7c355; --c-hist:#9c8bf0; --c-flood:#37b6a6;
    --anchor:#ffcf5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(1200px 700px at 70% -10%, #16203a 0%, var(--bg) 55%);background-color:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{overflow-x:hidden}
  .wrap{max-width:1440px;margin:0 auto;padding:30px 26px 70px}
  header.masthead{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:8px}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase;padding-right:90px;line-height:1.6}
  h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(34px,5vw,58px);line-height:.98;margin:.22em 0 .1em;letter-spacing:.01em}
  h1 .sub{display:block;font-size:.42em;letter-spacing:.06em;color:var(--c-proph);font-weight:600;margin-top:.35em;line-height:1.25}
  .prov{color:var(--muted);font-size:13px;max-width:780px;line-height:1.55;margin-top:12px}
  .prov b{color:var(--ink);font-weight:500}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 6px}
  .toolbar .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-right:4px}
  .chip{cursor:pointer;user-select:none;border:1px solid var(--line2);background:var(--panel);color:var(--ink);
    padding:7px 13px;border-radius:100px;font-size:12.5px;display:inline-flex;align-items:center;gap:8px;transition:.18s}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip:hover{border-color:var(--muted)}
  .chip.off{opacity:.32;filter:saturate(.2)}
  .grid{display:grid;grid-template-columns:1fr;gap:22px;margin-top:20px}
  .card{background:linear-gradient(180deg,var(--panel),#10162494);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px 14px;position:relative;overflow:hidden;min-width:0}
  .card h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:23px;margin:2px 0 2px}
  .card .hint{color:var(--muted);font-size:12.5px;margin-bottom:8px;line-height:1.5}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
  @media(max-width:880px){.bottom{grid-template-columns:1fr}}
  text{font-family:'Space Grotesk',sans-serif}
  .mono{font-family:'JetBrains Mono',monospace}
  svg text.h{paint-order:stroke;stroke:#0b0f1a;stroke-width:3.4px;stroke-linejoin:round}
  #tip{position:fixed;pointer-events:none;z-index:50;max-width:300px;background:#0c1220f2;border:1px solid var(--line2);
    border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.5;color:var(--ink);opacity:0;
    transition:opacity .12s;box-shadow:0 18px 40px -18px #000;left:0;top:0}
  #tip .t-h{font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:7px}
  #tip .t-h .d{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  #tip .t-yr{font-family:'JetBrains Mono',monospace;color:var(--c-proph);font-size:11.5px}
  #tip .t-b{color:var(--muted);margin-top:4px}
  .mathgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:6px 0 14px}
  .mrow{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0e1526}
  .mrow .eq{font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
  .mrow .cap{font-size:11.5px;color:var(--muted);line-height:1.45}
  .mrow .aw{font-size:10.5px;color:#6f7a96;font-style:italic;font-family:'JetBrains Mono',monospace;margin-top:2px}
  .base138{color:var(--anchor);font-weight:600}
  .foot{color:var(--muted);font-size:12px;line-height:1.6;border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
  .anchor-key{display:inline-flex;align-items:center;gap:7px;color:var(--anchor);font-size:12.5px;font-family:'JetBrains Mono',monospace}
  .anchor-key i{width:2px;height:14px;background:var(--anchor);display:inline-block;box-shadow:0 0 8px var(--anchor)}
  details.tx{margin-top:4px}
  details.tx summary{cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--c-comet);text-transform:uppercase;padding:6px 0}
  .tx h3{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;font-weight:500}
  .tx ul{margin:0;padding-left:18px}
  .tx li{font-size:13px;line-height:1.55;margin:3px 0;color:#d3dbec}
  .tx li .unc{color:#f08a4b;font-family:'JetBrains Mono',monospace;font-size:11px}
  .cols{columns:2 420px;column-gap:28px}
  .cols>div{break-inside:avoid}
  .swipe{display:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#5d6885;letter-spacing:.14em;text-transform:uppercase;margin:2px 0 6px}
  .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 16px;margin:10px 0 4px}
  .legend div{font-size:12px;color:var(--muted);line-height:1.45;display:flex;gap:8px;cursor:pointer}
  .legend b{color:var(--anchor);font-family:'JetBrains Mono',monospace;font-weight:500;flex:0 0 auto}
  @media(max-width:700px){
    .wrap{padding:54px 16px 60px}
    .mathgrid{grid-template-columns:1fr}
    .scroller svg.wide{min-width:860px}
    .scroller svg.mid{min-width:620px}
    .kicker{padding-right:0;letter-spacing:.28em}
    .swipe{display:block}
  }
%%CSS%%
</style>
</head>
<body>
